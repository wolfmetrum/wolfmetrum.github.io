<!doctype html>
<!-- Ko-fi page banner, 1200x400. Rendered to kofi-banner-1200x400.png by a headless browser screenshot (same look as ../ecpay). -->
<html lang="en"><head><meta charset="utf-8">
<style>
  :root { --paper: #0B1220; --paper-2: #131C2E; --gold: #D4A84B; --gold-2: #EBCF8E; --ink: #EDE6D6; --ink-2: #8F9AB3; --serif: "Noto Serif TC", serif; }
  html, body { margin: 0; }
  .b { position: relative; display: flex; align-items: center; gap: 48px; box-sizing: border-box; width: 1200px; height: 400px; padding: 0 96px 8px;
       background: radial-gradient(ellipse at 20% 45%, var(--paper-2), var(--paper) 70%); border-bottom: 8px solid var(--gold); overflow: hidden; font-family: var(--serif); }
  .b img { width: 250px; height: 250px; flex-shrink: 0; }
  .t { display: grid; gap: 14px; }
  .n { font-size: 76px; font-weight: 600; line-height: 1; color: var(--ink); }
  .z { font-size: 34px; color: var(--gold); letter-spacing: 0.08em; }
  .m { margin-top: 10px; font-size: 26px; color: var(--ink-2); }
  .mz { font-size: 22px; color: var(--ink-2); }
  i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--gold-2); opacity: .65; }
  i.l { width: 5px; height: 5px; opacity: .8; }
</style></head>
<body><div class="b">
  <img src="../../assets/images/wolfmetrum-logo.svg" alt="">
  <div class="t">
    <div class="n">Wolf Metrum</div>
    <div class="z" lang="zh-TW">狼的格律</div>
    <div class="m">Let the untamed soul bow to the meter of grace</div>
    <div class="mz" lang="zh-TW">讓未馴的靈魂，臣服於恩典的格律</div>
  </div>
  <i style="left:840px;top:52px"></i><i class="l" style="left:960px;top:96px"></i><i style="left:1060px;top:40px"></i><i style="left:1130px;top:150px"></i>
  <i style="left:1010px;top:300px"></i><i class="l" style="left:1110px;top:250px"></i><i style="left:900px;top:340px"></i><i style="left:760px;top:24px"></i>
  <i style="left:1160px;top:330px"></i><i style="left:690px;top:360px"></i><i style="left:600px;top:30px"></i>
</div></body></html>
